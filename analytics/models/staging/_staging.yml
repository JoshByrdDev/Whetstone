version: 2

models:
  - name: stg_board__cycle_runs
    description: One worker run. The run-tracking columns are NULL for runs recorded before they existed.
    columns:
      - name: run_id
        tests: [unique, not_null]
      - name: ticket_id
        tests: [not_null]
      - name: started_at
        tests: [not_null]
      - name: phase
        tests: [not_null]
      - name: outcome
        tests:
          - accepted_values:
              arguments:
                values: ['Completed', 'Timeout', 'Error']
  - name: stg_board__qa_ruling_events
    description: One ruling on one QA item - a status, a carry-over, or refinement's expiry - with the run that made it.
    columns:
      - name: event_id
        tests: [unique, not_null]
      - name: qa_item_id
        tests: [not_null]
      - name: kind
        tests:
          - accepted_values:
              arguments:
                values: ['Driven', 'ByInspection', 'CarriedOver', 'Failed', 'Blocked', 'Expired']
  - name: stg_board__phase_transitions
    columns:
      - name: transition_id
        tests: [unique, not_null]
      - name: moved_at
        tests: [not_null]
  - name: stg_board__tickets
    columns:
      - name: ticket_id
        tests: [unique, not_null]
  - name: stg_git__skill_versions
    columns:
      - name: valid_from
        tests: [not_null]
    tests:
      - unique_combination:
          arguments:
            columns: [project_key, skill, commit_sha]
  - name: stg_git__prompt_versions
    columns:
      - name: commit_sha
        tests: [unique, not_null]
  - name: stg_transcripts__tool_uses
    columns:
      - name: tool_use_id
        tests: [unique, not_null]
      - name: tool_name
        tests: [not_null]
  - name: stg_transcripts__tool_results
    columns:
      - name: tool_use_id
        tests: [unique]
  - name: stg_transcripts__costs
    columns:
      - name: session_id
        tests: [unique]
  - name: stg_board__bug_links
    tests:
      - unique_combination:
          arguments:
            columns: [bug_ticket_id, source_ticket_id]
    columns:
      - name: link_id
        tests: [unique, not_null]
      - name: status
        tests:
          - accepted_values:
              arguments:
                values: [Suggested, Confirmed, Rejected]
      - name: share
        tests: [is_fraction]
      - name: missed_by
        tests:
          - accepted_values:
              arguments:
                values: [speculate, implement, qa-test, refine, review]
  - name: stg_board__bug_traces
    columns:
      - name: bug_ticket_id
        tests: [unique, not_null]
  - name: stg_board__ticket_commits
    columns:
      - name: ticket_commit_id
        tests: [unique, not_null]
  - name: stg_board__experiments
    columns:
      - name: experiment_id
        tests: [unique, not_null]
      - name: status
        tests:
          - accepted_values:
              arguments:
                values: [Running, Stopped, Concluded]
  - name: stg_board__experiment_arms
    tests:
      - unique_combination:
          arguments:
            columns: [experiment_id, arm_key]
    columns:
      - name: arm_key
        tests:
          - accepted_values:
              arguments:
                values: [control, variant]
  - name: stg_board__experiment_assignments
    tests:
      - unique_combination:
          arguments:
            columns: [experiment_id, ticket_id]
